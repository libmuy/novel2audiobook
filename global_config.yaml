llm:
  model_name: "/srv/unsafe/models/llm/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf"
  api_base: "http://localhost:8080/v1"  # 本机 llama-server（ai llm serve qwen3.8-27b-unsloth）实际监听端口
  serve_port: 8080
  serve_model_registry_name: "qwen3.8-27b-unsloth"  # `ai llm serve <name>` 使用的注册表名（与 api_base 端口对应）
  temperature: 0.3  # 结构化 JSON 抽取任务，取偏低温度保证输出稳定可解析
  max_tokens: 2048
  request_timeout_sec: 60
  connect_check_timeout_sec: 3
  server_start_timeout_sec: 180  # gpu_arbiter 拉起 llama-server 后等待其就绪的超时

tts:
  engine: "Index-TTS-2.5"
  sample_rate: 24000
  channels: 1
  format: "wav"
  index_tts:
    python_bin: "tools/indextts_env/bin/python"       # 独立 venv（ROCm torch），见 docs/indextts_setup.md
    infer_script: "tools/indextts_infer.py"
    repo_dir: "tools/indextts_repo"                   # index-tts 官方源码仓库
    checkpoints_dir: "/srv/unsafe/models/tts/IndexTTS-2.5"
    timeout_sec: 10800  # 批量合成一整章（含模型加载）；实测本机 RTF ~6-9x，
                         # 121 句/3757 字约需 65-70 分钟，此处留足余量

asset_gen:
  spec_file: "assets/asset_specs.yaml"
  target_sample_rate: 24000          # 与 audio_mixer.MIX_SAMPLE_RATE 对齐
  ambience_loop_crossfade_ms: 2000   # ambience 素材首尾等功率交叉淡化时长，用于无缝循环
  ambience_target_dbfs: -20.0        # ambience 素材归一化的平均响度（dBFS）
  sfx_target_dbfs: -6.0              # sfx 素材归一化的峰值响度（dBFS）
  ambience_engine: "ACE-Step-1.5"        # 仅用于日志展示；实际选型见下方 ace_step 配置段
  sfx_engine: "Stable-Audio-3-Small-SFX" # 仅用于日志展示；实际选型见下方 stable_audio 配置段
  ace_step:
    python_bin: "tools/acestep_env/bin/python"       # 独立 venv（ROCm torch），见 docs/audiogen_setup.md
    infer_script: "tools/acestep_infer.py"
    repo_dir: "tools/acestep_repo"                   # ACE-Step 官方源码仓库
    checkpoints_dir: "/srv/unsafe/models/audiogen/ACE-Step-1.5"
    timeout_sec: 3600
  stable_audio:
    python_bin: "tools/stableaudio_env/bin/python"   # 独立 venv（ROCm torch + Flash-Attention 2），见 docs/audiogen_setup.md
    infer_script: "tools/stableaudio_infer.py"
    checkpoints_dir: "/srv/unsafe/models/audiogen/stable-audio-3-small-sfx"
    timeout_sec: 1800

mixing:
  ducking_threshold: -20.0  # dBFS RMS 阈值
  ducking_volume_ratio: 0.3 # BGM 闪避时降低到的音量比例 (30%)
  ducking_fade_ms: 300      # 渐变过渡毫秒数
  ambience_gain_db: -18.0   # 环境音基础电平（相对满幅 dBFS），避免盖过人声
  sfx_limit_dbfs: -3.0      # 音效峰值限幅，防止叠加人声后爆音
  output_format: "mp3"
  bitrate: "192k"
